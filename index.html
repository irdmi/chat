<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Chat</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="call.css">
  <!-- Заглушка favicon чтобы избежать 404 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js" defer></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <button id="menu-btn" class="icon-btn">☰</button>
      <h1 id="display-name">Chat</h1>
      <button id="call-btn" class="icon-btn small-btn" title="Start call">📞</button>
      <button id="reload-btn" class="icon-btn small-btn">↻</button>
    </header>

    <div id="login-screen">
      <h2>Join Chat</h2>
      <!-- autocomplete="off" чтобы браузер не предлагал сохранение -->
      <input type="text" id="userName" placeholder="Your name" autocomplete="off">
      <input type="password" id="seedPhrase" placeholder="Encryption seed (key)" autocomplete="off">
      <button onclick="enterChat()">Join Chat</button>
      <button onclick="createNewChat()" class="secondary-btn">+ New Chat</button>
    </div>

    <div id="chat-screen" style="display: none;">
      <div id="messages"></div>
      <div class="input-area">
        <input type="text" id="msgInput" placeholder="Message..." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>

    <!-- Call Overlay -->
    <div id="call-overlay" class="call-overlay hidden">
      <video id="remote-video" autoplay playsinline class="remote-video"></video>
      <video id="local-video" autoplay playsinline muted class="local-video"></video>
      
      <div class="call-info">
        <h3 id="call-peer">User</h3>
        <span id="call-status">Connecting...</span>
        <span id="call-type" class="badge">🟡 Relay</span>
        <span id="call-timer">00:00</span>
      </div>
      
      <div class="call-controls">
        <button id="btn-mute" class="ctrl-btn">🔇</button>
        <button id="btn-video" class="ctrl-btn">📹</button>
        <button id="btn-hangup" class="ctrl-btn hangup">✕</button>
      </div>
    </div>

    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h3>Chats</h3>
        <button id="close-sidebar" class="close-btn">✕</button>
      </div>
      <ul id="chat-list"></ul>
      <button onclick="createNewChat()" class="secondary-btn full-width">+ New Chat</button>
    </div>

    <div id="overlay" class="overlay"></div>
  </div>

  <!-- Script в конце body БЕЗ defer -->
  <script src="js/app.js"></script>
</body>
</html>
